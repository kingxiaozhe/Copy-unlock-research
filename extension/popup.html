<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #2563eb;
        --border: #e5e7eb;
        --ok: #16a34a;
        --off: #9ca3af;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        font: 13px/1.5 -apple-system, system-ui, "PingFang SC", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
      header h1 { font-size: 14px; margin: 0; }
      header .host { color: var(--muted); font-size: 12px; margin-top: 4px; word-break: break-all; }
      header .count { color: var(--ok); font-size: 12px; margin-top: 6px; }
      header .count.zero { color: var(--muted); }
      .section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .row + .row { margin-top: 12px; }
      .label { font-weight: 500; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .switch { position: relative; width: 42px; height: 24px; flex: none; }
      .switch input { display: none; }
      .slider { position: absolute; inset: 0; background: var(--off); border-radius: 999px; transition: .15s; cursor: pointer; }
      .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
      .switch input:checked + .slider { background: var(--ok); }
      .switch input:checked + .slider::before { transform: translateX(18px); }
      button {
        width: 100%; padding: 9px 12px; border: 1px solid var(--accent); border-radius: 8px;
        background: #fff; color: var(--accent); font-size: 13px; cursor: pointer;
      }
      button:active { opacity: .85; }
      .hint { color: var(--muted); font-size: 11px; padding: 10px 16px; }
      .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; }
      .badge.on { background: #dcfce7; color: var(--ok); }
      .badge.off { background: #f3f4f6; color: var(--off); }
    </style>
  </head>
  <body>
    <header>
      <h1>复制解锁 <span id="badge" class="badge off">—</span></h1>
      <div class="host" id="host">读取中…</div>
      <div class="count zero" id="count"></div>
    </header>

    <div class="section">
      <div class="row">
        <div>
          <div class="label">在本站启用</div>
          <div class="sub">解除选中 / 复制 / 右键限制</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div>
          <div class="label">本站始终强力 ⚡</div>
          <div class="sub">穿透 Shadow DOM、拦截动态限制（持久）。少数站点验证码 / Cloudflare 可能受影响</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="strong" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="row">
        <div>
          <div class="label">划词浮窗复制</div>
          <div class="sub">选中文字后浮现「复制」按钮</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="selbar" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <button id="extract" style="margin-bottom:8px">📄 提取正文并预览</button>
      <button id="deep">⚡ 强力解锁本页（仅这次）</button>
      <div class="sub" style="margin-top:8px">提取正文：抽出页面主要文字，弹出可复制的阅读层。强力解锁：标准模式搞不定时的临时增强。</div>
    </div>

    <div class="hint">仅解除「前端」复制限制。不绕过任何付费墙 / VIP / 版权保护。</div>

    <script src="src/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
