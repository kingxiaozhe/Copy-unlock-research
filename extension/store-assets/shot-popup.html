<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"WenQuanYi Zen Hei",sans-serif}
  html,body{width:1280px;height:800px;background:#eef0f3}
  .wrap{width:1280px;height:800px;display:flex;align-items:center;justify-content:center;gap:64px;padding:60px}
  .left{max-width:520px}
  .left h1{font-size:42px;color:#16181d;line-height:1.3;margin-bottom:18px}
  .left h1 span{color:#16a34a}
  .left p{font-size:21px;color:#5a6068;line-height:1.9;margin-bottom:28px}
  .feats{list-style:none}
  .feats li{font-size:19px;color:#33383f;padding:9px 0;display:flex;align-items:center;gap:12px}
  .feats li b{color:#16a34a;font-size:22px}
  /* browser + popup mock */
  .browser{width:430px;border-radius:16px;box-shadow:0 24px 60px rgba(20,30,50,.22);overflow:hidden;background:#fff}
  .bar{height:54px;background:#f1f3f5;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid #e4e7ea}
  .dot{width:12px;height:12px;border-radius:50%}
  .url{flex:1;height:30px;background:#fff;border-radius:8px;margin:0 10px;border:1px solid #e0e3e7}
  .exticon{position:relative;width:34px;height:34px}
  .exticon img{width:34px;height:34px;border-radius:8px}
  .exticon .b{position:absolute;right:-6px;bottom:-6px;background:#16a34a;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;border:2px solid #f1f3f5}
  .popup{padding:24px}
  .phead{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .phead img{width:40px;height:40px;border-radius:9px}
  .phead .t{font-size:20px;font-weight:700;color:#16181d}
  .phead .s{font-size:13px;color:#16a34a}
  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:12px;background:#f7f8fa;margin-bottom:12px}
  .row .lab{font-size:17px;color:#2b2f36}
  .row .sub{font-size:13px;color:#8a9099;margin-top:2px}
  .sw{width:50px;height:28px;border-radius:999px;position:relative;flex:none}
  .sw.on{background:#16a34a}.sw.off{background:#cfd4da}
  .sw i{position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw.on i{right:3px}.sw.off i{left:3px}
  .stat{text-align:center;font-size:14px;color:#8a9099;margin-top:14px}
  .stat b{color:#16a34a}
</style>
<div class="wrap">
  <div class="left">
    <h1>一键解除网页的<br><span>禁复制 / 禁右键</span></h1>
    <p>在事件捕获阶段抢先中和限制，<br>解锁的同时不破坏页面正常功能。</p>
    <ul class="feats">
      <li><b>✓</b> 解除禁选中 / 禁复制 / 禁右键</li>
      <li><b>✓</b> 强力模式应对顽固站点（含 Shadow DOM）</li>
      <li><b>✓</b> 划词浮窗复制 · 一键提取正文</li>
      <li><b>✓</b> 单站开关，设置自动记住</li>
    </ul>
  </div>
  <div class="browser">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <div class="url"></div>
      <div class="exticon"><img src="../icons/icon128.png"><span class="b">ON</span></div>
    </div>
    <div class="popup">
      <div class="phead">
        <img src="../icons/icon128.png">
        <div><div class="t">复制解锁</div><div class="s">本页已解除限制</div></div>
      </div>
      <div class="row"><div><div class="lab">本站启用</div><div class="sub">在 example.com 自动解锁</div></div><span class="sw on"><i></i></span></div>
      <div class="row"><div><div class="lab">本站始终强力</div><div class="sub">刷新仍生效</div></div><span class="sw off"><i></i></span></div>
      <div class="row"><div><div class="lab">划词浮窗复制</div><div class="sub">选中即可一键复制</div></div><span class="sw on"><i></i></span></div>
      <div class="stat">本页已拦截 <b>12</b> 次限制 · <b>零联网</b></div>
    </div>
  </div>
</div>
