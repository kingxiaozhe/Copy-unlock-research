<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"WenQuanYi Zen Hei",sans-serif}
  html,body{width:1400px;height:560px;background:#eaf7ee}
  .wrap{width:1400px;height:560px;display:flex;align-items:center;padding:0 96px;gap:80px}
  .mark{flex:none;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
  .mark img{width:230px;height:230px;border-radius:52px;box-shadow:0 26px 60px rgba(14,122,55,.35)}
  .txt{max-width:820px}
  .txt h1{font-size:62px;color:#13151a;line-height:1.18}
  .txt h1 span{color:#16a34a}
  .txt p{font-size:25px;color:#566;margin-top:18px}
  .txt .chips{margin-top:30px;display:flex;gap:16px}
  .txt .chips span{font-size:20px;color:#15803d;background:#fff;border:1px solid #bfe9cc;border-radius:999px;padding:11px 24px;box-shadow:0 4px 14px rgba(14,122,55,.08)}
</style>

<div class="wrap">
  <div class="mark"><img src="../icons/icon128.png"></div>
  <div class="txt">
    <h1>复制解锁 · <span>Copy Unlock</span></h1>
    <p>一键解除网页对选中 / 复制 / 右键的前端限制，让你能看到的内容，能复制。</p>
    <div class="chips"><span>🔒 零联网</span><span>🚫 无广告</span><span>✓ 不破坏页面</span><span>&lt;/&gt; 开源</span></div>
  </div>
</div>
