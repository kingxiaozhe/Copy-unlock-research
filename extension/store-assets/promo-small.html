<!doctype html><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"WenQuanYi Zen Hei",sans-serif}
  html,body{width:440px;height:280px;background:#fff}
  .wrap{display:grid;grid-template-columns:158px 1fr;width:440px;height:280px;overflow:hidden}
  .l{background:linear-gradient(150deg,#1bb255,#0e7a37);display:flex;align-items:center;justify-content:center}
  .l img{width:96px;height:96px;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .r{min-width:0;padding:0 28px 40px;display:flex;flex-direction:column;justify-content:center}
  .r h1{font-size:29px;color:#16181d;line-height:1.35;font-weight:700}
  .r h1 span{color:#16a34a}
  .r p{font-size:15px;color:#6a7079;margin-top:16px;line-height:1.8}
</style>
<div class="wrap">
  <div class="l"><img src="../icons/icon128.png"></div>
  <div class="r">
    <h1>一键解除<br><span>网页禁复制</span></h1>
    <p>禁选中、禁右键、禁复制，<br>统统解除，还不破坏页面。</p>
  </div>
</div>
